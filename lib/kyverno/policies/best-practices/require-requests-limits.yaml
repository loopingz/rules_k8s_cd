apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require Limits and Requests
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      As application workloads share cluster resources, it is important to limit
      resources requested and consumed by each Pod. It is recommended to require
      resource requests and limits per Pod, especially for memory and CPU.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: allContainers
      expression: 'object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])'
  validations:
    - expression: 'variables.allContainers.all(c, c.?resources.?requests.?memory.orValue('''') != '''' && c.?resources.?requests.?cpu.orValue('''') != '''' && c.?resources.?limits.?memory.orValue('''') != '''')'
      message: 'CPU and memory resource requests and memory limits are required for containers.'
