name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retry_targets:
        description: Finish the release of the current VERSION (forge release, release targets) after a partial failure
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
# One release run at a time, never cancelled half-way.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The release tool reads the whole history and the tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Cache the release graph
        uses: actions/cache@v6
        with:
          path: ~/.cache/rules_k8s_cd/release
          key: release-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            release-${{ runner.os }}-

      # Note: pull requests opened with GITHUB_TOKEN do not trigger other
      # workflows (such as CI). To run CI on release PRs, use a personal
      # access token or a GitHub App token in the FORGE_TOKEN secret instead.
      # lib/tests/release holds release_component fixtures that must not be released.
      - name: Release
        run: >
          bazel run //go/release -- run
          --components '//... - //lib/tests/...'
          ${{ inputs.retry_targets && '--retry-targets' || '' }}
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by `gh` in the release targets, which inherit this environment
          # (GH_REPO: they run from the runfiles tree, not the checkout).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
